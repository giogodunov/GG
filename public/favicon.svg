<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3B2B" />
      <stop offset="100%" stop-color="#0F241A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle / circle for crisp tab visibility in both light and dark browser modes -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#FBBF24" stroke-width="2" stroke-opacity="0.35" />

  <!-- InGeorgiaTours "G" Emblem -->
  <g transform="translate(19, 21) scale(0.98)">
    <!-- Left C-Arc Segment -->
    <path
      d="M 46 10.2
         A 42 42 0 0 0 46 93.8
         L 46 73.6
         A 22 22 0 0 1 46 30.4
         Z"
      fill="#FFFFFF"
    />

    <!-- Right Bottom Arc & G Horizontal Crossbar -->
    <path
      d="M 54 93.8
         A 42 42 0 0 0 92 52
         L 92 38
         L 54 38
         L 54 55
         L 70 55
         A 22 22 0 0 1 54 73.6
         Z"
      fill="#FFFFFF"
    />

    <!-- Top-Right Golden Accent -->
    <rect
      x="54"
      y="10.2"
      width="24"
      height="22"
      rx="3"
      fill="url(#goldGrad)"
    />
  </g>
</svg>
