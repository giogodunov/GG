<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Rich emerald gradient background -->
    <linearGradient id="faviconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3B2B" />
      <stop offset="100%" stop-color="#0F241A" />
    </linearGradient>

    <!-- Glowing golden amber gradient for the accent -->
    <linearGradient id="faviconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Subtle drop shadow for crisp visibility on any browser background -->
    <filter id="tabShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Crisp squircle frame with dark green background & thin gold border -->
  <rect width="128" height="128" rx="28" fill="url(#faviconBg)" />
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-opacity="0.45" />

  <!-- InGeorgiaTours Custom Logo "G" Symbol with crisp vectors -->
  <g transform="translate(18, 19) scale(1.02)" filter="url(#tabShadow)">
    <!-- Left C-Arc Segment (Pure White) -->
    <path
      d="M 46 10.2
         A 42 42 0 0 0 46 93.8
         L 46 73.6
         A 22 22 0 0 1 46 30.4
         Z"
      fill="#FFFFFF"
    />

    <!-- Right Bottom Arc & G Horizontal Crossbar (Pure White) -->
    <path
      d="M 54 93.8
         A 42 42 0 0 0 92 52
         L 92 38
         L 54 38
         L 54 55
         L 70 55
         A 22 22 0 0 1 54 73.6
         Z"
      fill="#FFFFFF"
    />

    <!-- Top-Right Golden Accent Block (G Emblem Signature) -->
    <rect
      x="54"
      y="10.2"
      width="24"
      height="22"
      rx="3"
      fill="url(#faviconGold)"
    />
  </g>
</svg>
